<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>협력 vs 배신</title><style>
:root{--ink:#171717;--paper:#fffaf0;--gold:#d7a52b;--red:#b42318;--green:#237a57;--line:#e8dcc7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:radial-gradient(circle at top,#fff7df 0,#f4ead7 42%,#ead9c1 100%);color:var(--ink);min-height:100vh}.wrap{max-width:980px;margin:auto;padding:22px 16px 50px}.hero{text-align:center;padding:18px 10px}.hero .symbol{font-size:44px}.hero h1{font-family:Georgia,serif;font-size:38px;margin:5px 0 2px;letter-spacing:-1px}.hero p{margin:0;color:#725d43}.card{background:rgba(255,250,240,.96);border:1px solid var(--line);border-radius:22px;padding:22px;margin:15px 0;box-shadow:0 10px 30px #60451b18}.title{font-family:Georgia,serif;margin-top:0}.code{font-size:42px;letter-spacing:9px;text-align:center;background:#211f1b;color:#fff8e8;border-radius:18px;padding:18px;margin:12px 0;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{min-height:130px;font-size:24px;font-weight:800;border:2px solid transparent}.coop{background:#237a57;color:white}.betray{background:#b42318;color:white}.choice:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.05)}button{border:0;border-radius:13px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#29251f;color:white;margin:4px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e9dfcd;color:#2c261e}.badge{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#fffdf7;margin:7px 0}.online{font-size:12px}.online.yes{color:#18794e}.online.no{color:#9a3412}.mini{padding:6px 9px;font-size:12px;background:#8b2e25}input{width:100%;padding:14px;border:1px solid #d9cbb5;border-radius:12px;font-size:17px;background:#fffdf8;margin:5px 0 14px}label{font-weight:700;font-size:14px}.error{color:#a61b12;font-weight:700}.qrbox{text-align:center}.qrbox img{max-width:280px;width:100%;background:#fff;padding:12px;border-radius:16px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fffdf8}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{background:#f1e7d5}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;background:#eee3d0}.final{border:2px solid var(--gold)}.roundline{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-bottom:1px dashed #d8c9b0}.roundline:last-child{border-bottom:0}.score{font-size:24px;font-weight:800}.bye{font-size:18px;font-weight:800;text-align:center;padding:22px}.muted{color:#766c5d}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:31px}.code{font-size:34px;letter-spacing:6px}.roundline{display:block}.choice{min-height:105px}}
</style></head><body><div class="wrap"><div class="hero"><div class="symbol">🤝 ⚡</div><h1>협력 vs 배신</h1><p>상대의 선택을 예측하라.</p></div><div id="app"></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({transports:["websocket","polling"]}),app=document.getElementById("app"),params=new URLSearchParams(location.search);let room=(params.get("room")||"").trim().toUpperCase(),my=null,teacher=null,qr=null;let role=room&&localStorage.getItem("pd_player_token_"+room)?"student":null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){role==="teacher"?tv():role==="student"?sv():landing()}
function landing(){app.innerHTML=`<div class="card"><h2 class="title">👩‍🏫 교사</h2><button onclick="create()">새 게임방 만들기</button></div><div class="card"><h2 class="title">👨‍🎓 학생</h2><label>방 코드</label><input id="room" value="${esc(room)}" placeholder="예: A7K3P"><label>닉네임</label><input id="nick" maxlength="24" placeholder="친구들이 알아볼 이름"><button onclick="join()">게임 참가</button><p id="err" class="error"></p></div>`}
function create(){socket.emit("createRoom",{origin:location.origin},r=>{if(!r.ok)return alert(r.error);role="teacher";room=r.code;qr=r.qr;history.replaceState({},'',`?room=${room}`);render()})}
function join(){let c=document.getElementById("room").value.trim().toUpperCase(),n=document.getElementById("nick").value.trim(),old=localStorage.getItem("pd_player_token_"+c)||"";socket.emit("joinRoom",{code:c,nickname:n,token:old},r=>{if(!r.ok){document.getElementById("err").textContent=r.error;return}room=c;if(r.token)localStorage.setItem("pd_player_token_"+room,r.token);localStorage.setItem("pd_player_name_"+room,r.nickname||n);role="student";history.replaceState({},'',`?room=${room}`);render()})}
function tv(){let s=teacher||{players:[],round:0,phase:"lobby",results:[]},p=s.players;app.innerHTML=`<div class="card"><h2 class="title">👩‍🏫 교사 화면</h2><div class="code">${room}</div><div class="qrbox"><img src="${qr||""}" alt="게임방 QR"><p class="muted">QR이 인식되지 않으면 위의 <b>참여코드</b>를 학생에게 보여주세요.</p></div><h3>참가자 <span class="pill">${p.length}명</span></h3><div>${p.map(x=>`<div class="badge"><span>${esc(x.nickname)} <span class="online ${x.connected?"yes":"no"}">${x.connected?"● 온라인":"○ 오프라인"}</span></span><button class="mini" onclick="kick('${esc(x.id)}','${esc(x.nickname)}')">내보내기</button></div>`).join("")||"<p class='muted'>아직 참가자가 없습니다.</p>"}</div><p>현재: <b>${s.round}/3 라운드</b></p>${s.phase==="lobby"?`<button onclick="start()">1라운드 시작</button>`:""}${s.phase==="roundResult"&&s.round<3?`<button onclick="next()">다음 라운드 → 무작위 재매칭</button>`:""}${s.phase==="finished"?`<h3>🎉 3라운드 완료!</h3>`:""} <button class="secondary" onclick="resetGame()">게임 초기화</button></div>${s.phase==="playing"?`<div class="card"><b>선택 현황</b><p>${p.filter(x=>x.choice).length}/${p.length}명 선택</p></div>`:""}${(s.results||[]).map((rr,i)=>`<div class="card"><h3 class="title">${i+1}라운드 결과</h3><table><tr><th>학생</th><th>선택</th><th>상대</th><th>선택</th><th>점수</th></tr>${rr.map(x=>`<tr><td>${esc(x.aNickname)}</td><td>${x.aChoice==="C"?"협력":"배신"}</td><td>${esc(x.bNickname)}</td><td>${x.bChoice==="C"?"협력":"배신"}</td><td>${x.aPoints}:${x.bPoints}</td></tr>`).join("")}</table></div>`).join("")}<div class="card"><h3 class="title">🏆 누적 순위</h3><table><tr><th>순위</th><th>닉네임</th><th>점수</th></tr>${[...p].sort((a,b)=>b.total-a.total).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.nickname)}</td><td>${x.total}</td></tr>`).join("")}</table></div>`}
function sv(){
 const s=my||{};let body="";
 if(s.phase==="lobby"){
  body=`<h3 class="title">게임 시작을 기다리는 중</h3><p>교사가 시작하면 상대가 무작위로 정해집니다.</p>`;
 }else if(s.bye){
  body=`<div class="bye">이번 라운드는 쉬는 라운드입니다.<br><span class="muted">다음 라운드에는 새로운 상대와 만납니다.</span></div>`;
 }else if(s.phase==="playing"){
  const opp=esc(s.opponent?.nickname||"매칭 중");
  body=`<h2>${s.round}라운드</h2><h2>🎯 내 상대: ${opp}</h2><p class="muted">상대의 선택은 내가 선택하기 전에는 보이지 않습니다.</p><div class="grid"><button class="choice coop" onclick="choose('C')" ${s.myChoice?"disabled":""}>🤝 협력</button><button class="choice betray" onclick="choose('D')" ${s.myChoice?"disabled":""}>⚡ 배신</button></div>${s.myChoice?`<p>내 선택: <b>${s.myChoice==="C"?"협력":"배신"}</b> — 상대를 기다리는 중</p>`:""}`;
 }else if(s.phase==="roundResult"){
  const x=s.result;
  const mine=x?(x.a===s.me.id?x.aChoice:x.bChoice):null;
  const oc=x?(x.a===s.me.id?x.bChoice:x.aChoice):null;
  const pts=x?(x.a===s.me.id?x.aPoints:x.bPoints):0;
  body=`<h2>${s.round}라운드 결과</h2><p>상대: <b>${esc(s.opponent?.nickname||"")}</b></p><p>나: <b>${mine==="C"?"협력":"배신"}</b> / 상대: <b>${oc==="C"?"협력":"배신"}</b></p><h3>이번 라운드 ${pts}점</h3><p class="muted">교사가 다음 라운드를 시작하면 새로운 상대와 매칭됩니다.</p>`;
 }else if(s.phase==="finished"){
  const rows=(s.history||[]).map(x=>`<div class="roundline"><div><b>${x.round}라운드</b><br>상대: <b>${esc(x.opponent)}</b><br>나: ${x.choice==="C"?"🤝 협력":"⚡ 배신"} / 상대: ${x.opponentChoice==="C"?"🤝 협력":"⚡ 배신"}</div><div class="score">+${x.points}점</div></div>`).join("");
  body=`<div class="final card"><h2>🎉 게임 종료!</h2><div class="score">내 최종 점수 ${s.me?.total||0}점</div><h3 class="title">나의 3라운드 기록</h3>${rows||"<p>기록이 없습니다.</p>"}</div>`;
 }
 app.innerHTML=`<div class="card"><h2 class="title">👨‍🎓 ${esc(s.me?.nickname||"학생")}</h2>${body}</div>`;
}
function start(){socket.emit("startGame",{code:room},r=>{if(!r.ok)alert(r.error)})}
function next(){socket.emit("nextRound",{code:room},r=>{if(!r.ok)alert(r.error)})}
function choose(c){socket.emit("choose",{code:room,choice:c},r=>{if(!r.ok)alert(r.error)})}
function kick(id,n){if(confirm(`'${n}' 학생을 게임방에서 내보낼까요?`))socket.emit("kickPlayer",{code:room,token:id},r=>{if(!r.ok)alert(r.error)})}
function resetGame(){if(confirm("게임을 초기화할까요?"))socket.emit("reset",{code:room},r=>{if(!r.ok)alert(r.error)})}
socket.on("teacherState",s=>{teacher=s;render()});
socket.on("studentState",s=>{my=s;if(s?.me?.id&&!localStorage.getItem("pd_player_token_"+s.code))localStorage.setItem("pd_player_token_"+s.code,s.me.id);render()});
socket.on("kicked",x=>{localStorage.removeItem("pd_player_token_"+room);role=null;my=null;alert(x.message);history.replaceState({},'',`?room=${room}`);render()});
socket.on("connect",()=>{if(role==="student"&&room){const t=localStorage.getItem("pd_player_token_"+room);if(t)socket.emit("joinRoom",{code:room,nickname:my?.me?.nickname||localStorage.getItem("pd_player_name_"+room)||"",token:t},()=>{})}});
render();
</script></body></html>
